<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Favicons -->
        <link rel="icon" href="./assets/favicons/favicon.ico" sizes="48x48" />
        <link rel="icon" href="./assets/favicons/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="./assets/favicons/apple-touch-icon.png" />
        <link rel="manifest" href="./assets/favicons/manifest.webmanifest" />
        <!-- End favicons -->

        <!-- Css -->
        <link rel="stylesheet" href="css/theme.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/components.css" />
        <!-- End Css -->
        
        <title data-i18n="meta.title">Great Wall</title>
    </head>
    <body>
        <!-- Loader -->
        <div id="loader">
            <div class="logo-loader">
                <img src="./assets/icons/vector/parts/logo-animated.svg" alt="Loading..." data-i18n-attr="alt:loader.alt">
            </div>
            <p class="loader__tagline" data-i18n="loader.tagline"></p>
        </div>
        <!-- End Loader -->
        

        <header class="header" id="home">
            <nav class="nav">
                <div class="logo-container">
                    <a href="./index.html">
                        <img src="./assets/icons/vector/logo-great-wall-scholars-white-gold.svg" alt="Logo" class="logo">
                    </a>
                </div>

                <div class="header__box">
                    <button class="btn btn__language">
                        <!--! should make it dynamical, display FR or EN depending on the user's language choice  -->
                    </button>

                    <div class="theme-switcher" id="theme-toggle">
                        <!-- Dynamically switch between theme icon depending on the current theme -->
                    </div>

                    <div class="hamburger">
                        <span></span>

                        <span></span>

                        <span></span>
                    </div>
                </div>
            </nav>

            <div class="header__text">
                <div class="eyebrow-container">
                    <div class="eyebrow header__eyebrow" data-i18n="header.eyebrow"></div>
                    <span class="underline header__underline"></span>
                </div>
                
                <h1 class="header__heading--main" data-i18n="header.heading--main"></h1>

                <h2 class="header__heading--sub" data-i18n="header.heading--sub"></h2>

                <div class="header__cta-box">
                    <a href="#">
                        <button class="btn btn__apply-now" data-i18n="header.btn--apply">
                    </a>
                    </button>

                    <a href="#">
                        <button class="btn btn__how-it-works" data-i18n="header.btn--how-it-works"></button>
                    </a>
                </div>
            </div>
        </header>

        <section class="section-trust-line">
            <div class="trust-line-container">
                <div class="trust-line trust-line--1" data-i18n="trust-line.1"></div>
                <div class="trust-line trust-line--2" data-i18n="trust-line.2"></div>
                <div class="trust-line trust-line--3" data-i18n="trust-line.3"></div>
                <div class="trust-line trust-line--4" data-i18n="trust-line.4"></div>
            </div>
        </section>

        <main>
            <section class="section-how-it-works">
                <div class="heading-container u-margin-top-huge u-margin-bottom-big">
                    <div class="eyebrow-container">
                        <div class="eyebrow heading__eyebrow" data-i18n="how-it-works.eyebrow"></div>

                        <span class="underline"></span>
                    </div>

                    <h1 class="heading-primary" data-i18n="how-it-works.heading"></h1>
                </div>
                
                <div class="content">
                    <div class="how-it-works--steps">
                        <div class="step">
                            <span class="step--number" data-i18n="how-it-works.step--1"></span>

                            <div class="step--text">
                                <h3 class="heading-tertiary" data-i18n="how-it-works.step__1--title"></h3>

                                <p class="step--paragraph" data-i18n="how-it-works.step__1--paragraph"></p>
                            </div>
                        </div>

                        <div class="step">
                            <span class="step--number" data-i18n="how-it-works.step--2"></span>

                            <div class="step--text">
                                <h3 class="heading-tertiary" data-i18n="how-it-works.step__2--title"></h3>

                                <p class="step--paragraph" data-i18n="how-it-works.step__2--paragraph"></p>
                            </div>
                        </div>

                        <div class="step">
                            <span class="step--number" data-i18n="how-it-works.step--3"></span>

                            <div class="step--text">
                                <h3 class="heading-tertiary" data-i18n="how-it-works.step__3--title"></h3>

                                <p class="step--paragraph" data-i18n="how-it-works.step__3--paragraph"></p>
                            </div>
                        </div>

                        <div class="step">
                            <span class="step--number" data-i18n="how-it-works.step--4"></span>

                            <div class="step--text">
                                <h3 class="heading-tertiary" data-i18n="how-it-works.step__4--title"></h3>

                                <p class="step--paragraph" data-i18n="how-it-works.step__4--paragraph"></p>
                            </div>
                        </div>

                        <div class="step">
                            <span class="step--number" data-i18n="how-it-works.step--5"></span>

                            <div class="step--text">
                                <h3 class="heading-tertiary" data-i18n="how-it-works.step__5--title"></h3>

                                <p class="step--paragraph" data-i18n="how-it-works.step__5--paragraph"></p>
                            </div>
                        </div>
                    </div>

                    <p class="how-it-works__tracker-callout" data-i18n="how-it-works.tracker-callout"></p>

                    <a href="#">
                        <button class="btn btn__apply-now" data-i18n="how-it-works.btn__apply"></button>
                    </a>
                </div>
            </section>
        </main>

        <!-- JS  -->
        <script src="./js/i18n.js"></script>
        <script src="./js/main.js"></script>
        <script src="./js/theme.js"></script>
    </body>
</html>
